<style>

    position:sticky;top:0;z-index:100;

  }

  .ng-nav__links a:hover::after{width:100%;}

    flex:0 0 auto;

    transition:transform .2s ease, background .2s ease;

  .ng-nav__burger span{width:22px;height:2px;background:#111;border-radius:2px;transition:.3s;}

  @media (max-width:820px){
    .ng-nav__links{
      position:fixed;left:0;right:0;top:57px;transform:none;

  }
  @media (max-width:420px){
    .ng-nav__cta{display:none;}
  }
</style>

<script>
(function(){
  var burger = document.getElementById('ng-burger');
  var links  = document.getElementById('ng-nav-links');
  if(!burger) return;
  burger.addEventListener('click', function(){
    var open = links.classList.toggle('open');
    burger.classList.toggle('open', open);
    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  // close menu after clicking a link (mobile)
  links.querySelectorAll('a').forEach(function(a){
    a.addEventListener('click', function(){
      links.classList.remove('open');
      burger.classList.remove('open');
      burger.setAttribute('aria-expanded','false');
    });
  });
})();
</script>

<script>
(function(){
  // scroll-in for the video cards and section heads
  var els = document.querySelectorAll('.sf-sec [data-anim]');
  if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){
          var el = e.target;
          setTimeout(function(){ el.classList.add('is-in'); }, (el.dataset.i||0)*50);
          io.unobserve(el);
        }
      });
    }, {threshold:.1, rootMargin:'0px 0px -40px 0px'});
    els.forEach(function(c,i){ c.dataset.i = i % 10; io.observe(c); });
  } else {
    els.forEach(function(c){ c.classList.add('is-in'); });
  }
})();
</script>

<script>
(function(){
  var els = [].slice.call(document.querySelectorAll('[data-vimeo-protect]'));
  if(!els.length || !window.fetch) return;
  var cache = {}, pending = {};
  try { cache = JSON.parse(sessionStorage.getItem('vthumbs') || '{}'); } catch(e){}
  function save(){ try { sessionStorage.setItem('vthumbs', JSON.stringify(cache)); } catch(e){} }
  function idOf(el){ var f = el.querySelector('iframe'); var m = f && f.src.match(/video\/(\d+)/); return m ? m[1] : null; }
  function poster(id){
    if(cache[id]) return Promise.resolve(cache[id]);
    if(pending[id]) return pending[id];
    pending[id] = fetch('https://vimeo.com/api/oembed.json?width=640&url=' + encodeURIComponent('https://vimeo.com/' + id))
      .then(function(r){ if(!r.ok) throw new Error('oembed ' + r.status); return r.json(); })
      .then(function(j){
        var url = j.thumbnail_url, m = (url || '').match(/\/video\/([^_?\/]+)/);
        if(m && j.width && j.height) url = 'https://i.vimeocdn.com/video/' + m[1] + '_640x' + Math.round(640 * j.height / j.width) + '.jpg';
        if(!url) throw new Error('no thumbnail');
        cache[id] = url; save(); return url;
      });
    return pending[id];
  }
  els.forEach(function(el){
    var id = idOf(el); if(!id) return;
    poster(id).then(function(url){ el.style.setProperty('background-image', 'url("' + url + '")', 'important'); }).catch(function(){});
  });
})();
</script>

<script>
(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- Smooth scroll ----
  if(!reduce && typeof Lenis !== 'undefined'){
    var lenis = new Lenis({
      duration: 1.1,
      smoothWheel: true,
      autoRaf: true
    });
    window.lenis = lenis;
  }

  // ---- Smooth in-page anchor navigation (nav links, CTA cards, etc.) ----
  document.querySelectorAll('a[href^="#"]').forEach(function(a){
    var href = a.getAttribute('href');
    if(!href || href.length < 2) return;
    a.addEventListener('click', function(e){
      var target = document.querySelector(href);
      if(!target) return;
      if(window.lenis){
        e.preventDefault();
        window.lenis.scrollTo(target, {offset: -64});
      }
      // otherwise let the browser's native anchor jump + CSS
      // scroll-behavior:smooth (see head) handle it.
    });
  });

  // ---- Video protection ----
  // The portfolio clips are embedded as Vimeo "background mode" iframes
  // (no player chrome, no click-through) with pointer-events disabled, so
  // right-click / drag never reaches the iframe in the first place. These
  // extra listeners are a small additional deterrent for the wrapper
  // elements themselves. None of this is a substitute for turning on
  // Vimeo's own protections on the account that owns these videos:
  //   Video settings → Privacy → "Allow download" = off, and
  //   Video settings → Privacy → domain-restrict embeds to this site.
  // Client-side tricks alone can never fully stop a determined download
  // (devtools / screen recording always exist) — the Vimeo-side settings
  // are the real control.
  document.querySelectorAll('[data-vimeo-protect]').forEach(function(el){
    el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
    el.addEventListener('dragstart', function(e){ e.preventDefault(); });
  });

  // All 20 clips load eagerly and simultaneously - no lazy-load, no
  // staged waterfall, no gating on scroll/idle/viewport of any kind, on
  // desktop or mobile. (A staged version was tried and reverted: it
  // relied on requestIdleCallback firing promptly, which isn't
  // guaranteed on a real device under load, and could leave later
  // sections showing only their poster thumbnail for too long.)

  // ---- Hover-to-unmute ----
  // The two hero pill clips (.ng-vid) are deliberately excluded: they stay muted always.
  // Every clip autoplays muted (required for autoplay in every browser).
  // Hovering a clip unmutes just that one via Vimeo's official Player
  // API; moving off it (or onto a different clip) re-mutes it, so at
  // most one clip plays sound at a time. The iframes themselves have
  // pointer-events:none (see the download-deterrent block above), so
  // hover is detected on the wrapper - the iframe is transparent to
  // pointer events, meaning the wrapper is already the effective hover
  // target with no changes needed there.
  // ---- Hover focus ----
  // HOVER_MODE picks what happens to the OTHER clips while one is hovered:
  //   'pause' : the others pause, only the hovered clip plays
  //   'fade'  : the others dim (CSS), the hovered clip is brightened
  //   'both'  : pause + dim
  // Moving the mouse off resumes / restores everything. Only on devices
  // with a real hover pointer (never on touch screens).
  var HOVER_MODE = 'both';
  var canHover = window.matchMedia('(hover: hover)').matches;
  if(typeof Vimeo !== 'undefined' && Vimeo.Player){
    var soundWraps = document.querySelectorAll('.ng-vidwrap');
    var activePlayer = null;
    var players = [];
    var restoreTimer = null;
    var doPause = HOVER_MODE === 'pause' || HOVER_MODE === 'both';
    var doFade  = HOVER_MODE === 'fade'  || HOVER_MODE === 'both';
    soundWraps.forEach(function(wrap){
      var iframe = wrap.querySelector('iframe.ng-vimeo');
      if(!iframe) return;
      var player = new Vimeo.Player(iframe);
      players.push({wrap:wrap, player:player});
      wrap.addEventListener('mouseenter', function(){
        if(activePlayer && activePlayer !== player){
          activePlayer.setMuted(true).catch(function(){});
        }
        activePlayer = player;
        player.setMuted(false).catch(function(){});
        if(!canHover) return;
        clearTimeout(restoreTimer);
        document.body.classList.toggle('ng-hover-fade', doFade);
        players.forEach(function(p){
          var me = p.player === player;
          p.wrap.classList.toggle('is-hover', me);
          if(doPause){ (me ? p.player.play() : p.player.pause()).catch(function(){}); }
        });
      });
      wrap.addEventListener('mouseleave', function(){
        player.setMuted(true).catch(function(){});
        if(activePlayer === player) activePlayer = null;
        if(!canHover) return;
        // short delay so gliding straight onto a neighbour doesn't flicker
        clearTimeout(restoreTimer);
        restoreTimer = setTimeout(function(){
          document.body.classList.remove('ng-hover-fade');
          players.forEach(function(p){
            p.wrap.classList.remove('is-hover');
            if(doPause) p.player.play().catch(function(){});
          });
        }, 80);
      });
    });
  }
})();
</script>
